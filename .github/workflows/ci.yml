name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Prepare
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        # golden: reference PNGs are produced on Windows (fonts from
        # C:/Windows/Fonts), not comparable on Linux. benchmark: a performance
        # gate measured against the reference device, not shared runners.
        run: flutter test --coverage --exclude-tags golden,benchmark

  # Web 版独立开发中（见 README「Web 版」章节），完成后在此追加
  # build-web / deploy-pages jobs。
