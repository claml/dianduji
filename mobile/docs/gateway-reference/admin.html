<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>典读鸡 · 词库管理后台</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --ink: #1c1e21; --muted: #6b7280;
    --accent: #2f6fed; --border: #e3e6ea; --ok: #16a34a; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  header h1 { font-size: 17px; margin: 0; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type="text"], input[type="password"] { font: inherit; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); }
  main { max-width: 860px; margin: 20px auto; padding: 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .status { font-size: 13px; margin: 8px 0 0; min-height: 1.2em; }
  .status.err { color: var(--err); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
    font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .word { font-weight: 600; }
  .def { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 6px; }
  .confirm { color: var(--ok); border-color: var(--ok); }
  .drop { color: var(--err); border-color: var(--err); }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 8px; }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.confirmed { background: #dcfce7; color: #166534; }
  .badge.dropped { background: #fee2e2; color: #991b1b; }
  #login-view { max-width: 360px; margin: 60px auto; }
  #login-view .card { display: flex; flex-direction: column; gap: 10px; }
  #filters { display: flex; gap: 6px; }
  #filters button.active { border-color: var(--accent); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<header>
  <h1>典读鸡 · 词库管理后台</h1>
  <span class="spacer"></span>
  <span class="muted" id="user-label"></span>
  <button id="logout-btn" hidden>退出登录</button>
</header>

<div id="login-view" hidden>
  <div class="card">
    <h2>登录</h2>
    <input id="gw-url" type="text" placeholder="网关地址（如 http://127.0.0.1:8080）" />
    <input id="username" type="text" placeholder="用户名" autocomplete="username" />
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
    <button id="login-btn" class="primary">登录</button>
    <p class="status" id="login-status"></p>
  </div>
</div>

<main id="admin-view" hidden>
  <div class="card">
    <div class="row">
      <button id="refresh-btn" class="primary">刷新列表</button>
      <button id="enrich-btn">LLM 整理待处理词</button>
      <span id="filters">
        <button data-status="pending" class="active">待整理</button>
        <button data-status="confirmed">已确认</button>
        <button data-status="dropped">已丢弃</button>
      </span>
    </div>
    <p class="status" id="admin-status"></p>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr><th>词</th><th>释义（LLM 整理后）</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="candidate-rows"></tbody>
    </table>
    <div class="empty" id="admin-empty" hidden>没有候选词</div>
  </div>
</main>

<script>
'use strict';
const API_KEY = 'dianduji.admin';
const gwUrl = document.getElementById('gw-url');
const usernameEl = document.getElementById('username');
const passwordEl = document.getElementById('password');
const loginStatus = document.getElementById('login-status');
const adminStatus = document.getElementById('admin-status');
const userLabel = document.getElementById('user-label');
const rows = document.getElementById('candidate-rows');
const empty = document.getElementById('admin-empty');

let token = null;
let username = '';
let currentStatus = 'pending';

function root() {
  const stored = localStorage.getItem(API_KEY + '.root');
  const value = (gwUrl.value || stored || 'http://127.0.0.1:8080').trim();
  localStorage.setItem(API_KEY + '.root', value);
  return value;
}

async function api(method, path, body) {
  const response = await fetch(root() + path, {
    method,
    headers: {
      'Content-Type': 'application/json; charset=utf-8',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* keep null */ }
  if (!response.ok) {
    throw new Error((json && json.error) || ('HTTP ' + response.status));
  }
  return json;
}

async function login() {
  loginStatus.textContent = '登录中…';
  loginStatus.className = 'status';
  try {
    const result = await api('POST', '/auth/login', {
      username: usernameEl.value.trim(),
      password: passwordEl.value,
    });
    token = result.token;
    username = result.user.username;
    localStorage.setItem(API_KEY + '.user', JSON.stringify({ username }));
    showAdmin();
  } catch (error) {
    loginStatus.textContent = '登录失败：' + error.message;
    loginStatus.className = 'status err';
  }
}

function logout() {
  token = null;
  username = '';
  localStorage.removeItem(API_KEY + '.user');
  showLogin();
}

function showLogin() {
  document.getElementById('login-view').hidden = false;
  document.getElementById('admin-view').hidden = true;
  document.getElementById('logout-btn').hidden = true;
}

function showAdmin() {
  document.getElementById('login-view').hidden = true;
  document.getElementById('admin-view').hidden = false;
  document.getElementById('logout-btn').hidden = false;
  userLabel.textContent = '已登录：' + username;
  refresh();
}

async function refresh() {
  adminStatus.textContent = '加载中…';
  adminStatus.className = 'status';
  try {
    const result = await api('GET', '/candidates?status=' + currentStatus);
    render(result.candidates || []);
    adminStatus.textContent = '';
  } catch (error) {
    adminStatus.textContent = '加载失败：' + error.message;
    adminStatus.className = 'status err';
  }
}

function render(candidates) {
  rows.replaceChildren();
  empty.hidden = candidates.length > 0;
  for (const candidate of candidates) {
    const tr = document.createElement('tr');
    const word = document.createElement('td');
    word.className = 'word';
    word.textContent = candidate.surface;
    const def = document.createElement('td');
    def.className = 'def';
    const parts = [
      candidate.phonetic ? '/' + candidate.phonetic + '/' : '',
      candidate.definitionChinese,
      candidate.definitionEnglish,
    ].filter(Boolean);
    def.textContent = parts.join('  ') || '（未整理）';
    const state = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + candidate.status;
    badge.textContent = { pending: '待整理', confirmed: '已确认', dropped: '已丢弃' }[candidate.status] || candidate.status;
    state.appendChild(badge);
    const actions = document.createElement('td');
    actions.className = 'actions';
    if (candidate.status === 'pending') {
      actions.appendChild(actionButton('确认入库', 'confirm', candidate.surface));
      actions.appendChild(actionButton('丢弃', 'drop', candidate.surface));
    } else if (candidate.status === 'confirmed') {
      actions.appendChild(actionButton('撤销为待整理', 'pending', candidate.surface));
    }
    tr.append(word, def, state, actions);
    rows.appendChild(tr);
  }
}

function actionButton(label, action, surface) {
  const button = document.createElement('button');
  button.textContent = label;
  button.className = action === 'confirm' ? 'confirm' : (action === 'drop' ? 'drop' : '');
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      await api('POST', '/candidates/resolve', { surface, action });
      await refresh();
    } catch (error) {
      adminStatus.textContent = '操作失败：' + error.message;
      adminStatus.className = 'status err';
      button.disabled = false;
    }
  });
  return button;
}

async function enrich() {
  adminStatus.textContent = 'LLM 整理中（可能需要几十秒）…';
  adminStatus.className = 'status';
  enrichBtn.disabled = true;
  try {
    const result = await api('POST', '/candidates/enrich', {});
    adminStatus.textContent = '整理完成，更新 ' + result.updated + ' 词';
    await refresh();
  } catch (error) {
    adminStatus.textContent = '整理失败：' + error.message;
    adminStatus.className = 'status err';
  } finally {
    enrichBtn.disabled = false;
  }
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('refresh-btn').addEventListener('click', refresh);
document.getElementById('enrich-btn').addEventListener('click', enrich);
document.getElementById('filters').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-status]');
  if (!button) return;
  currentStatus = button.dataset.status;
  for (const other of document.querySelectorAll('#filters button')) {
    other.classList.toggle('active', other === button);
  }
  refresh();
});

// Restore a previous session.
gwUrl.value = localStorage.getItem(API_KEY + '.root') || '';
try {
  const saved = JSON.parse(localStorage.getItem(API_KEY + '.user') || 'null');
  if (saved && saved.username) {
    usernameEl.value = saved.username;
  }
} catch { /* ignore */ }
showLogin();
</script>
</body>
</html>
